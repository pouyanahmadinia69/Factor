<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انتخاب سفارش و فاکتور</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#12343b;--mute:#5f7a7f;--line:#d9e3e2;--brand:#0f5c63;--accent:#e8a317;--onbrand:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1c1f;--card:#16292d;--ink:#e6f0ef;--mute:#93aeb1;--line:#27424a;--brand:#4fb3bb;--accent:#f0b43a;--onbrand:#0e1c1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.7rem;font-weight:800;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 20px}
.layout{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:820px){.layout{grid-template-columns:1.25fr 1fr;align-items:start}.invoice{position:sticky;top:16px}}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.pic{aspect-ratio:4/3;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:3rem}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.name{font-weight:600}
.price{color:var(--mute);font-size:.92rem}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.3rem;cursor:pointer}
.stepper button.plus{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.stepper button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qty{font-weight:800;font-size:1.15rem;min-width:2ch;text-align:center}
.invoice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.invoice h2{margin:0 0 4px;font-size:1.2rem}
.meta{color:var(--mute);font-size:.88rem;display:flex;justify-content:space-between;margin-bottom:12px}
.cust{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{color:var(--mute);font-weight:400;text-align:right;border-bottom:1px solid var(--line);padding:6px 4px}
td{padding:8px 4px;border-bottom:1px dashed var(--line)}
td.n,th.n{text-align:left}
.empty{color:var(--mute);text-align:center;padding:22px 0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink);font-weight:800;font-size:1.15rem}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--onbrand);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.admin{background:var(--card);border:2px dashed var(--accent);border-radius:14px;padding:16px;margin-bottom:20px}
.admin h2{margin:0 0 4px;font-size:1.1rem}
.admin p{margin:0 0 12px;color:var(--mute);font-size:.9rem}
.arow{display:grid;grid-template-columns:56px 1fr 120px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.arow input[type=text],.arow input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.5rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.arow .del{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit}
.arow input[type=file]{display:none}
@media (max-width:560px){.arow{grid-template-columns:56px 1fr auto}.arow .pr{grid-column:2/4}}
@media print{.admin{display:none}body{background:#fff;color:#000}.products,.actions,.sub,h1{display:none}.layout{display:block}.invoice{border:0;position:static}.cust{border:0;padding:0;background:none;color:#000}}
</style>
</head>
<body>
<div class="wrap">
  <h1>سفارش خود را انتخاب کنید</h1>
  <p class="sub">تعداد هر کالا را مشخص کنید؛ فاکتور هم‌زمان ساخته می‌شود.</p>
  <section class="admin" id="admin" hidden>
    <h2>ویرایش کالاها</h2>
    <p>کالا اضافه یا حذف کنید، روی کادر عکس بزنید تا عکس انتخاب شود. در پایان فایل را دانلود کنید و جای <b>products.json</b> در گیت‌هاب بگذارید.</p>
    <div id="rows"></div>
    <div class="actions">
      <button class="btn ghost" id="add">+ کالای جدید</button>
      <button class="btn" id="dl">دانلود products.json</button>
    </div>
  </section>
  <div class="layout">
    <div class="products" id="products"></div>
    <aside class="invoice">
      <h2>فاکتور</h2>
      <div class="meta"><span id="no"></span><span id="date"></span></div>
      <input class="cust" id="cust" placeholder="نام خریدار" autocomplete="name">
      <div id="lines"></div>
      <div class="total"><span>مبلغ قابل پرداخت</span><span id="sum">۰ تومان</span></div>
      <div class="actions">
        <a class="btn" id="send" href="#" target="_top" style="text-align:center;text-decoration:none">ارسال سفارش با پیامک</a>
        <button class="btn ghost" id="copy">کپی متن سفارش</button>
        <button class="btn ghost" id="print">چاپ / PDF</button>
      </div>
    </aside>
  </div>
</div>

<script>
const UNIT = "تومان";
const PHONE = "09125623688"; /* شماره‌ای که پیامک سفارش به آن می‌رود */
/* کالاها از فایل products.json خوانده می‌شوند. اگر فایل در دسترس نبود این نمونه‌ها نمایش داده می‌شود */
const FALLBACK = [
  { name: "کالای اول", price: 250000, image: "", icon: "📦" },
  { name: "کالای دوم", price: 480000, image: "", icon: "🎁" }
];
let PRODUCTS = [];
const qty = [];
const ADMIN = location.search.includes("admin");

const fa = n => n.toLocaleString("fa-IR");
const money = n => fa(n) + " " + UNIT;
const grid = document.getElementById("products");
function buildGrid() {
  grid.innerHTML = "";
  PRODUCTS.forEach((p, i) => {
    if (qty[i] === undefined) qty[i] = 0;
    const el = document.createElement("div");
    el.className = "card";
    el.id = "c" + i;
    el.innerHTML = `
      <div class="pic"></div>
      <div class="body">
        <div class="name"></div>
        <div class="price">${money(p.price)}</div>
        <div class="stepper">
          <button class="plus">+</button>
          <span class="qty" id="q${i}">۰</span>
          <button class="minus">−</button>
        </div>
      </div>`;
    el.querySelector(".name").textContent = p.name;
    el.querySelector(".plus").setAttribute("aria-label", "افزودن " + p.name);
    el.querySelector(".minus").setAttribute("aria-label", "کم کردن " + p.name);
    const pic = el.querySelector(".pic");
    if (p.image) {
      const img = document.createElement("img");
      img.alt = p.name;
      img.src = p.image;
      img.onerror = () => { pic.textContent = p.icon || "📦"; };
      pic.appendChild(img);
    } else pic.textContent = p.icon || "📦";
    el.querySelector(".plus").onclick = () => change(i, 1);
    el.querySelector(".minus").onclick = () => change(i, -1);
    grid.appendChild(el);
  });
  qty.length = PRODUCTS.length;
  render();
}

function change(id, d) {
  qty[id] = Math.max(0, Math.min(999, qty[id] + d));
  render();
}

function chosen() { return PRODUCTS.map((p, i) => ({ ...p, id: i })).filter(p => qty[p.id] > 0); }

function render() {
  PRODUCTS.forEach((p, i) => {
    document.getElementById("q" + i).textContent = fa(qty[i]);
    document.getElementById("c" + i).classList.toggle("on", qty[i] > 0);
  });
  const items = chosen();
  const box = document.getElementById("lines");
  if (!items.length) {
    box.innerHTML = '<div class="empty">هنوز کالایی انتخاب نشده است.</div>';
  } else {
    box.innerHTML = `<table><thead><tr><th>کالا</th><th class="n">تعداد</th><th class="n">قیمت واحد</th><th class="n">جمع</th></tr></thead><tbody>` +
      items.map(p => `<tr><td>${p.name}</td><td class="n">${fa(qty[p.id])}</td><td class="n">${fa(p.price)}</td><td class="n">${fa(p.price * qty[p.id])}</td></tr>`).join("") +
      `</tbody></table>`;
  }
  const total = items.reduce((s, p) => s + p.price * qty[p.id], 0);
  document.getElementById("sum").textContent = money(total);
  if (typeof updateSms === "function") updateSms();
}

const now = new Date();
document.getElementById("no").textContent = "شماره: " + fa(Number(String(now.getTime()).slice(-6)));
document.getElementById("date").textContent = now.toLocaleDateString("fa-IR");

document.getElementById("print").onclick = () => window.print();
function orderText() {
  const items = chosen();
  const name = document.getElementById("cust").value.trim();
  const total = items.reduce((s, p) => s + p.price * qty[p.id], 0);
  return (name ? "خریدار: " + name + "\n" : "") +
    items.map(p => `${p.name} × ${fa(qty[p.id])} = ${money(p.price * qty[p.id])}`).join("\n") +
    `\nجمع کل: ${money(total)}`;
}
function flash(btn, msg, back) {
  btn.textContent = msg;
  setTimeout(() => btn.textContent = back, 2000);
}
const sendBtn = document.getElementById("send");
function updateSms() {
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? "&" : "?";
  sendBtn.href = "sms:" + PHONE + sep + "body=" + encodeURIComponent(orderText());
}
sendBtn.addEventListener("click", e => {
  if (!chosen().length) {
    e.preventDefault();
    flash(sendBtn, "اول کالا انتخاب کنید", "ارسال سفارش با پیامک");
  }
});
document.getElementById("cust").addEventListener("input", updateSms);
document.getElementById("copy").onclick = async e => {
  if (!chosen().length) return;
  try { await navigator.clipboard.writeText(orderText()); flash(e.target, "کپی شد ✓", "کپی متن سفارش"); }
  catch { flash(e.target, "کپی نشد", "کپی متن سفارش"); }
};

/* ---------- ویرایش کالاها (فقط با آدرس ?admin) ---------- */
const toEn = v => String(v).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
function shrink(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 700 / im.width), c = document.createElement("canvas");
        c.width = im.width * k; c.height = im.height * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.8));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function buildRows() {
  const box = document.getElementById("rows");
  box.innerHTML = "";
  PRODUCTS.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "arow";
    row.innerHTML = `<label class="thumb" title="انتخاب عکس"><input type="file" accept="image/*"><span></span></label>
      <input type="text" class="nm" placeholder="نام کالا">
      <input type="number" class="pr" inputmode="numeric" placeholder="قیمت">
      <button class="del">حذف</button>`;
    const th = row.querySelector(".thumb span");
    const showThumb = () => { th.innerHTML = ""; if (p.image) { const im = document.createElement("img"); im.src = p.image; th.appendChild(im); } else th.textContent = p.icon || "📦"; };
    showThumb();
    row.querySelector(".nm").value = p.name;
    row.querySelector(".pr").value = p.price;
    row.querySelector(".nm").oninput = e => { p.name = e.target.value; buildGrid(); };
    row.querySelector(".pr").oninput = e => { p.price = Number(toEn(e.target.value)) || 0; buildGrid(); };
    row.querySelector("input[type=file]").onchange = async e => {
      if (e.target.files[0]) { p.image = await shrink(e.target.files[0]); showThumb(); buildGrid(); }
    };
    row.querySelector(".del").onclick = () => { PRODUCTS.splice(i, 1); qty.splice(i, 1); buildRows(); buildGrid(); };
    box.appendChild(row);
  });
}
if (ADMIN) {
  document.getElementById("admin").hidden = false;
  document.getElementById("add").onclick = () => { PRODUCTS.push({ name: "کالای جدید", price: 0, image: "", icon: "📦" }); buildRows(); buildGrid(); };
  document.getElementById("dl").onclick = () => {
    const blob = new Blob([JSON.stringify(PRODUCTS, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "products.json"; a.click();
  };
}

fetch("products.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .catch(() => FALLBACK)
  .then(list => { PRODUCTS = list; buildGrid(); updateSms(); if (ADMIN) buildRows(); });
</script>
</body>
</html>
