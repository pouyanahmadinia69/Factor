<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انتخاب سفارش و فاکتور</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#12343b;--mute:#5f7a7f;--line:#d9e3e2;--brand:#0f5c63;--accent:#e8a317;--onbrand:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1c1f;--card:#16292d;--ink:#e6f0ef;--mute:#93aeb1;--line:#27424a;--brand:#4fb3bb;--accent:#f0b43a;--onbrand:#0e1c1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.7rem;font-weight:800;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 20px}
.layout{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:820px){.layout{grid-template-columns:1.25fr 1fr;align-items:start}.invoice{position:sticky;top:16px}}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.pic{aspect-ratio:4/3;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:3rem}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.name{font-weight:600}
.price{color:var(--mute);font-size:.92rem}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.3rem;cursor:pointer}
.stepper button.plus{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.stepper button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qty{font-weight:800;font-size:1.15rem;min-width:2ch;text-align:center}
.invoice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.invoice h2{margin:0 0 4px;font-size:1.2rem}
.meta{color:var(--mute);font-size:.88rem;display:flex;justify-content:space-between;margin-bottom:12px}
.cust{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{color:var(--mute);font-weight:400;text-align:right;border-bottom:1px solid var(--line);padding:6px 4px}
td{padding:8px 4px;border-bottom:1px dashed var(--line)}
td.n,th.n{text-align:left}
.empty{color:var(--mute);text-align:center;padding:22px 0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink);font-weight:800;font-size:1.15rem}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--onbrand);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
@media print{body{background:#fff;color:#000}.products,.actions,.sub,h1{display:none}.layout{display:block}.invoice{border:0;position:static}.cust{border:0;padding:0;background:none;color:#000}}
</style>
</head>
<body>
<div class="wrap">
  <h1>سفارش خود را انتخاب کنید</h1>
  <p class="sub">تعداد هر کالا را مشخص کنید؛ فاکتور هم‌زمان ساخته می‌شود.</p>
  <div class="layout">
    <div class="products" id="products"></div>
    <aside class="invoice">
      <h2>فاکتور</h2>
      <div class="meta"><span id="no"></span><span id="date"></span></div>
      <input class="cust" id="cust" placeholder="نام خریدار" autocomplete="name">
      <div id="lines"></div>
      <div class="total"><span>مبلغ قابل پرداخت</span><span id="sum">۰ تومان</span></div>
      <div class="actions">
        <a class="btn" id="send" href="#" target="_top" style="text-align:center;text-decoration:none">ارسال سفارش با پیامک</a>
        <button class="btn ghost" id="copy">کپی متن سفارش</button>
        <button class="btn ghost" id="print">چاپ / PDF</button>
      </div>
    </aside>
  </div>
</div>

<script>
/* ===== اینجا کالاهای خودتان را ویرایش کنید =====
   image: مسیر عکس داخل پوشه images (اگر نبود، یک آیکون نمایش داده می‌شود)
   price: قیمت به تومان */
const PRODUCTS = [
  { id: 1, name: "کالای اول",  price: 250000, image: "images/1.jpg", icon: "📦" },
  { id: 2, name: "کالای دوم",  price: 480000, image: "images/2.jpg", icon: "🎁" },
  { id: 3, name: "کالای سوم",  price: 120000, image: "images/3.jpg", icon: "🧴" },
  { id: 4, name: "کالای چهارم", price: 890000, image: "images/4.jpg", icon: "👜" }
];
const UNIT = "تومان";
const PHONE = "09125623688"; /* شماره خودتان؛ پیامک سفارش به این شماره می‌رود */
/* ============================================== */

const fa = n => n.toLocaleString("fa-IR");
const money = n => fa(n) + " " + UNIT;
const qty = {};
PRODUCTS.forEach(p => qty[p.id] = 0);

const grid = document.getElementById("products");
PRODUCTS.forEach(p => {
  const el = document.createElement("div");
  el.className = "card";
  el.id = "c" + p.id;
  el.innerHTML = `
    <div class="pic"><img alt="${p.name}" src="${p.image}"></div>
    <div class="body">
      <div class="name">${p.name}</div>
      <div class="price">${money(p.price)}</div>
      <div class="stepper">
        <button class="plus" aria-label="افزودن ${p.name}">+</button>
        <span class="qty" id="q${p.id}">۰</span>
        <button class="minus" aria-label="کم کردن ${p.name}">−</button>
      </div>
    </div>`;
  const img = el.querySelector("img");
  img.onerror = () => { img.parentNode.textContent = p.icon; };
  el.querySelector(".plus").onclick = () => change(p.id, 1);
  el.querySelector(".minus").onclick = () => change(p.id, -1);
  grid.appendChild(el);
});

function change(id, d) {
  qty[id] = Math.max(0, Math.min(999, qty[id] + d));
  render();
}

function chosen() { return PRODUCTS.filter(p => qty[p.id] > 0); }

function render() {
  PRODUCTS.forEach(p => {
    document.getElementById("q" + p.id).textContent = fa(qty[p.id]);
    document.getElementById("c" + p.id).classList.toggle("on", qty[p.id] > 0);
  });
  const items = chosen();
  const box = document.getElementById("lines");
  if (!items.length) {
    box.innerHTML = '<div class="empty">هنوز کالایی انتخاب نشده است.</div>';
  } else {
    box.innerHTML = `<table><thead><tr><th>کالا</th><th class="n">تعداد</th><th class="n">قیمت واحد</th><th class="n">جمع</th></tr></thead><tbody>` +
      items.map(p => `<tr><td>${p.name}</td><td class="n">${fa(qty[p.id])}</td><td class="n">${fa(p.price)}</td><td class="n">${fa(p.price * qty[p.id])}</td></tr>`).join("") +
      `</tbody></table>`;
  }
  const total = items.reduce((s, p) => s + p.price * qty[p.id], 0);
  document.getElementById("sum").textContent = money(total);
  if (typeof updateSms === "function") updateSms();
}

const now = new Date();
document.getElementById("no").textContent = "شماره: " + fa(Number(String(now.getTime()).slice(-6)));
document.getElementById("date").textContent = now.toLocaleDateString("fa-IR");

document.getElementById("print").onclick = () => window.print();
function orderText() {
  const items = chosen();
  const name = document.getElementById("cust").value.trim();
  const total = items.reduce((s, p) => s + p.price * qty[p.id], 0);
  return (name ? "خریدار: " + name + "\n" : "") +
    items.map(p => `${p.name} × ${fa(qty[p.id])} = ${money(p.price * qty[p.id])}`).join("\n") +
    `\nجمع کل: ${money(total)}`;
}
function flash(btn, msg, back) {
  btn.textContent = msg;
  setTimeout(() => btn.textContent = back, 2000);
}
const sendBtn = document.getElementById("send");
function updateSms() {
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? "&" : "?";
  sendBtn.href = "sms:" + PHONE + sep + "body=" + encodeURIComponent(orderText());
}
sendBtn.addEventListener("click", e => {
  if (!chosen().length) {
    e.preventDefault();
    flash(sendBtn, "اول کالا انتخاب کنید", "ارسال سفارش با پیامک");
  }
});
document.getElementById("cust").addEventListener("input", updateSms);
document.getElementById("copy").onclick = async e => {
  if (!chosen().length) return;
  try { await navigator.clipboard.writeText(orderText()); flash(e.target, "کپی شد ✓", "کپی متن سفارش"); }
  catch { flash(e.target, "کپی نشد", "کپی متن سفارش"); }
};

render();
updateSms();
</script>
</body>
</html>
